services:
  - type: web
    name: aeropress-brews
    runtime: python
    # preDeployCommand is paid-plan only, so migrations run during the build
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn "api:create_app()"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_APP
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: aeropress-brews-db
          property: connectionString
      # Not secrets: the domain and audience appear in every token
      - key: AUTH0_DOMAIN
        value: dev-chmt7px7cn0johtc.us.auth0.com
      - key: API_AUDIENCE
        value: aeropress-brews

databases:
  - name: aeropress-brews-db
    plan: free
